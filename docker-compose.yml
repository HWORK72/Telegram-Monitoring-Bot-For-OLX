version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: olx_monitor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olx_monitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olx_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: